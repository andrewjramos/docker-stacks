# yt-dlp configuration
# see https://github.com/yt-dlp/yt-dlp?tab=readme-ov-file#configuration

#-r, --limit-rate RATE           Maximum download rate in bytes per second,
#                                e.g. 50K or 4.2M
#--limit-rate 1M

#--throttled-rate RATE           Minimum download rate in bytes per second
#                                below which throttling is assumed and the
#                                video data is re-extracted, e.g. 100K
#--throttled-rate 50K

#--sleep-requests SECONDS        Number of seconds to sleep between requests
#                                during data extraction
#--sleep-requests 10

#--sleep-interval SECONDS        Number of seconds to sleep before each
#                                download. This is the minimum time to sleep
#                                when used along with --max-sleep-interval
#                                (Alias: --min-sleep-interval)
#--sleep-interval 30

#--retry-sleep [TYPE:]EXPR       Time to sleep between retries in seconds
#                                (optionally) prefixed by the type of retry
#                                (http (default), fragment, file_access,
#                                extractor) to apply the sleep to. EXPR can
#                                be a number, linear=START[:END[:STEP=1]] or
#                                exp=START[:END[:BASE=2]]. This option can be
#                                used multiple times to set the sleep for the
#                                different retry types, e.g. --retry-sleep
#                                linear=1::2 --retry-sleep fragment:exp=1:20
#--retry-sleep fragment:300
#--retry-sleep http:300

#--no-abort-on-error             Continue with next video on download errors;
#                                e.g. to skip unavailable videos in a
#                                playlist (default)
--no-abort-on-error

#--download-archive FILE         Download only videos not listed in the
#                                archive file. Record the IDs of all
#                                downloaded videos in it
--download-archive /config/archive.txt

#-N, --concurrent-fragments N    Number of fragments of a dash/hlsnative
#                                video that should be downloaded concurrently
#                                (default is 1)
--concurrent-fragments 100

#-R, --retries RETRIES           Number of retries (default is 10), or
#                                "infinite"
--retries 0

#-a, --batch-file FILE           File containing URLs to download ("-" for
#                                stdin), one URL per line. Lines starting
#                                with "#", ";" or "]" are considered as
#                                comments and ignored
--batch-file /config/urls.txt

#--yes-playlist                  Download the playlist, if the URL refers to
#                                a video and a playlist
--yes-playlist

#-P, --paths [TYPES:]PATH        The paths where the files should be
#                                downloaded. Specify the type of file and the
#                                path separated by a colon ":". All the same
#                                TYPES as --output are supported.
#                                Additionally, you can also provide "home"
#                                (default) and "temp" paths. All intermediary
#                                files are first downloaded to the temp path
#                                and then the final files are moved over to
#                                the home path after download is finished.
#                                This option is ignored if --output is an
#                                absolute path
--paths temp:.incomplete
--paths home:/downloads

#-o, --output [TYPES:]TEMPLATE   Output filename template; see "OUTPUT
#                                TEMPLATE" for details
--output "%(uploader)s/%(title)s_%(id)s.%(ext)s"

#--restrict-filenames            Restrict filenames to only ASCII characters,
#                                and avoid "&" and spaces in filenames
--restrict-filenames

#-c, --continue                  Resume partially downloaded files/fragments
#                                (default)
--continue

#--write-info-json               Write video metadata to a .info.json file
#                                (this may contain personal information)
--write-info-json

#--cache-dir DIR                 Location in the filesystem where yt-dlp can
#                                store some downloaded information (such as
#                                client ids and signatures) permanently. By
#                                default ${XDG_CACHE_HOME}/yt-dlp
--cache-dir /config/

#--write-thumbnail               Write thumbnail image to disk
--write-thumbnail

#--no-progress                   Do not print progress bar
#--no-progress

#--remux-video FORMAT            Remux the video into another container if
#                                necessary (currently supported: avi, flv,
#                                gif, mkv, mov, mp4, webm, aac, aiff, alac,
#                                flac, m4a, mka, mp3, ogg, opus, vorbis,
#                                wav). If the target container does not
#                                support the video/audio codec, remuxing will
#                                fail. You can specify multiple rules; e.g.
#                                "aac>m4a/mov>mp4/mkv" will remux aac to m4a,
#                                mov to mp4 and anything else to mkv
--remux-video mkv

#--embed-thumbnail               Embed thumbnail in the video as cover art
--embed-thumbnail

#--embed-info-json               Embed the infojson as an attachment to
#                                mkv/mka video files
--embed-info-json

#--ffmpeg-location PATH          Location of the ffmpeg binary; either the
#                                path to the binary or its containing directory
--ffmpeg-location /usr/bin/ffmpeg
