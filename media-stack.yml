services:
 
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - bazarr-config:/config
      - media:/mnt/user/media/
    networks:
      usenet:
    ports:
      - ${TAILSCALE_IP}:6767:6767

  ersatztv:
    image: ghcr.io/ersatztv/ersatztv
    environment:
      - TZ=${TZ}
    volumes:
      - ersatztv-config:/config
      - ${TRANSCODE_DIR}/ersatztv:/transcode
      - media:/mnt/user/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      jellyfin:
    ports:
      - ${TAILSCALE_IP}:8409:8409
    restart: unless-stopped

  fileflows:
    image: revenz/fileflows
    restart: unless-stopped
    networks:
      jellyfin:
    ports:
      - ${TAILSCALE_IP}:5000:5000
    devices:
      - "/dev/dri:/dev/dri"
    environment:
      - TempPathHost=fileflows-transcode
      - BROWSER_START_DIR=/mnt/user/media
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRANSCODE_DIR}/fileflows:/temp
      - fileflows-data:/app/Data
      - fileflows-logs:/app/Logs
      - fileflows-common:/app/common
      - media:/mnt/user/media

  huntarr:
    image: huntarr/huntarr:latest
    restart: unless-stopped
    volumes:
      - huntarr-config:/config
    environment:
      - TZ=${TZ}
    networks:
      usenet:
    ports:
      - ${TAILSCALE_IP}:9705:9705

  jellyfin:
    image: jellyfin/jellyfin
    hostname: jellyfin
    user: ${PUID}:${PGID}
    group_add:
      - ${RENDER_PGID}
    ports:
      - 8096:8096
    environment:
      - JELLYFIN_CACHE_DIR=/var/cache/jellyfin
      - JELLYFIN_CONFIG_DIR=/etc/jellyfin
      - JELLYFIN_DATA_DIR=/var/lib/jellyfin
      - JELLYFIN_LOG_DIR=/var/log/jellyfin
      - TZ=${TZ}
    volumes:
      - jellyfin-config:/etc/jellyfin
      - jellyfin-config-empty:/config
      - jellyfin-cache:/var/cache/jellyfin
      - jellyfin-cache-empty:/cache
      - jellyfin-data:/var/lib/jellyfin
      - jellyfin-log:/var/log/jellyfin
      - ${TRANSCODE_DIR}/jellyfin:/transcode
      - media:/mnt/user/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      jellyfin:
      public:
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    volumes:
      - jellyseerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      public:
      usenet:
    
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    environment:
      - TZ=${TZ}
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    networks:
      public:
    ports:
      - ${TAILSCALE_IP}:81:81
      - 80:80
      - 443:443

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    networks:
      usenet:
    ports:
      - ${TAILSCALE_IP}:9696:9696

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - radarr-config:/config
      - media:/mnt/user/media/
    restart: unless-stopped
    networks:
      jellyfin:
      usenet:
    ports:
      - ${TAILSCALE_IP}:7878:7878

  radarr-4K:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - radarr-4K-config:/config
      - media:/mnt/user/media/
    restart: unless-stopped
    networks:
      jellyfin:
      usenet:
    ports:
      - ${TAILSCALE_IP}:7879:7878

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sabnzbd-config:/config
      - media:/mnt/user/media
    restart: unless-stopped
    networks:
      usenet:
    ports:
      - ${TAILSCALE_IP}:8080:8080
    
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sonarr-config:/config
      - media:/mnt/user/media/
    restart: unless-stopped
    networks:
      jellyfin:
      usenet:
    ports:
      - ${TAILSCALE_IP}:8989:8989

  sonarr-4K:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sonarr-4K-config:/config
      - media:/mnt/user/media/
    restart: unless-stopped
    networks:
      jellyfin:
      usenet:
    ports:
      - ${TAILSCALE_IP}:8990:8989

volumes:

  # Local Volumes
  bazarr-config:
  beszel_agent_data:
  ersatztv-config:
  fileflows-common:
  fileflows-data:
  fileflows-logs:
  fileflows-transcode:
  jellyfin-config:
  jellyfin-config-empty:
  jellyfin-cache:
  jellyfin-cache-empty:
  jellyfin-data:
  jellyfin-log:
  npm-data:
  npm-letsencrypt:
  bazaar-config:
  huntarr-config:
  jellyseerr-config:
  prowlarr-config:
  radarr-config:
  radarr-4K-config:
  sabnzbd-config:
  sonarr-config:
  sonarr-4K-config:

  # NFS Volumes
  media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${MEDIA_HOST},rw,hard,nolock,nfsvers=4
      device: ":${MEDIA_HOST_DIR}"

networks:
  jellyfin:
  usenet:
  public:
